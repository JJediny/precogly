name: 🐛 Bug Report
description: File a bug report to help us identify and fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: If applicable, add screenshots or terminal/console logs to help explain your problem.
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of Precogly is affected?
      options:
        - Frontend (React / DFD Editor / UI)
        - Backend (Django / API)
        - Threat Modeling Libraries & Rules
        - MCP Server
        - Integrations & Export
        - Documentation / Tooling
        - Infrastructure / Docker
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please specify OS, Browser, Python / Node version, Docker setup if relevant.
      placeholder: |
        - OS: [e.g. macOS, Ubuntu, Windows]
        - Browser: [e.g. Chrome, Firefox]
        - Setup: [e.g. Local Docker, Development server, Production]
    validations:
      required: false
  - type: checkboxes
    id: checklists
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I am willing to submit a PR to help fix this issue.
          required: false
