  name: EU MDR Cybersecurity
  version: 2017/745
  issuer: European Parliament
  description: EU Medical Device Regulation Annex I cybersecurity requirements
  requirements:
  - section_code: Annex-I-17.1
    description: Devices shall be designed and manufactured to eliminate or reduce risks associated with IT security
  - section_code: Annex-I-17.2
    description: Protection against unauthorized access through state of the art security measures
  - section_code: Annex-I-17.4
    description: Manufacturer shall provide information regarding IT security measures and residual risks
