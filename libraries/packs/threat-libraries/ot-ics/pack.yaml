pack:
  schema_version: 1
  slug: ot-ics
  name: OT/ICS Industrial Control Systems
  version: 1.1.0
  pack_type: full
  description: |
    Comprehensive OT/ICS library pack for threat modeling industrial control systems,
    SCADA networks, DCS environments, and safety instrumented systems. Includes components
    for PLCs, RTUs, HMIs, historians, and safety systems with threats mapped to MITRE
    ATT&CK for ICS and countermeasures aligned to IEC 62443. Designed for energy,
    oil and gas, chemical, and manufacturing sectors.
  author: Precogly
  depends_on:
    - taxonomies/stride-taxonomy
    - taxonomies/cwe
    - taxonomies/mitre-attack-ics
  tags:
    - ics
    - ot-security
    - scada
    - dcs
    - plc
    - industrial
    - critical-infrastructure
    - safety
    - energy
    - oil-gas
    - manufacturing
    - utilities
    - chemicals
